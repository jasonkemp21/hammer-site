<!-- phone dock -->
<div class="dock">
  <div class="dock__next"><span class="label">Next bell</span><b data-dock-next>7 AM · Boxing</b></div>
  <button class="btn btn--primary btn--sm" type="button" data-action="book-next" data-dock-book>Book</button>
</div>

<button class="fab" type="button" data-action="ask-open" aria-haspopup="dialog"><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg><span>Ask the front desk</span></button>

<div class="scrim" id="scrim" data-action="overlay-close" hidden></div>

<!-- centered sheets -->
<div class="sheet on-paper" data-ov="book" role="dialog" aria-modal="true" aria-labelledby="book-title" hidden><div class="sheet__in" data-reserve></div></div>
<div class="sheet on-paper" data-ov="quiz" role="dialog" aria-modal="true" aria-labelledby="quiz-title" hidden><div class="sheet__in" data-quiz></div></div>
<div class="sheet on-paper" data-ov="inquire" role="dialog" aria-modal="true" aria-labelledby="inq-title" hidden><div class="sheet__in" data-inquire></div></div>
<div class="sheet sheet--wide on-paper" data-ov="coach" role="dialog" aria-modal="true" aria-labelledby="coach-title" hidden><div class="sheet__in" data-coachcard></div></div>

<!-- drawers -->
<aside class="drawer on-ink" data-ov="ask" role="dialog" aria-modal="true" aria-labelledby="ask-title" hidden><div class="sheet__in ask" data-ask></div></aside>

<div class="toasts" id="toasts" aria-live="polite"></div>
